spring:
  application:
    name: loan-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loanops}
    username: ${DB_USER:loanops}
    password: ${DB_PASSWORD:loanops}
  flyway:
    # db/seed holds synthetic demo data. Set FLYWAY_LOCATIONS=classpath:db/migration to skip it.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
